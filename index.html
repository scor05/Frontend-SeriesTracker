<!DOCTYPE html>

<html>
    <head>
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="css/homeStyle.css"/>
        <script src="js/home.js" defer></script>
        <meta charset="UTF-8" name="viewport" content="width=device-width"/>
        <title>My Series Tracker</title>
    </head>

    <body>
        <div class="root">
            <div class="topbar">
                <h1 class="topbar-title">Series Tracker</h1>
                <input type="text" class="topbar-search" maxlength="50" placeholder="Busca alguna serie..."/>
                <div class="topbar-spacer"></div>
            </div>
            <div class="content">
                <h1 class="content-title">My Series Tracker</h1>
                <div class="content-controls">
                    <div class="content-pagination"></div>
                    <a class="content-addSeries" href="html/addSeries.html">
                        + Agregar
                    </a>
                </div>
                <div class="content-table-wrapper">
                    <table class="content-table">
                        <tr>
                            <th>Portada</th>
                            <th>Nombre y Descripción</th>
                            <th>Episodio actual</th>
                            <th>Episodios Totales</th>
                            <th>Rating</th>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
